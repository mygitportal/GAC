name: Build AetherSpot APK
on:
  push:
    branches: [aetherspot-build-android9]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: aetherspot-native
        run: gradle --no-daemon clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherSpot-Android9-debug
          path: aetherspot-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
