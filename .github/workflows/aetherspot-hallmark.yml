name: Build AetherSpot Hallmark APK
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reassemble source archive
        run: cat source.part.00 source.part.01 source.part.02 source.part.03 > AetherSpot-Hallmark-v0.2-source.zip
      - name: Verify and unpack source
        run: unzip -t AetherSpot-Hallmark-v0.2-source.zip && unzip -q AetherSpot-Hallmark-v0.2-source.zip
      - name: Build debug APK
        working-directory: AetherSpot
        run: gradle --no-daemon clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherSpot-Hallmark-v0.2-debug
          path: AetherSpot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
